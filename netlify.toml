[build]
  command = "cd server && npm ci --omit=dev && cd .. && mkdir -p dist && cp file.html dist/index.html && cp resume.pdf dist/resume.pdf && cp _redirects dist/_redirects"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
